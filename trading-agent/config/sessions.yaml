# Session gating. Times are LOCAL to each session's `timezone`; zoneinfo handles DST (GMT/BST, EST/EDT…)
# automatically, so we never hardcode a UTC offset. A bar trades if it falls in ANY `active` session.
# The dashboard's Sessions dialog edits `active`; edit a preset's hours here.
active: [tokyo, london]

sydney: { timezone: Australia/Sydney, start: "07:00", end: "16:00", weekdays: [Mon, Tue, Wed, Thu, Fri] }
tokyo: { timezone: Asia/Tokyo, start: "09:00", end: "18:00", weekdays: [Mon, Tue, Wed, Thu, Fri] }
london: { timezone: Europe/London, start: "07:00", end: "16:00", weekdays: [Mon, Tue, Wed, Thu, Fri] }
new_york: { timezone: America/New_York, start: "08:00", end: "17:00", weekdays: [Mon, Tue, Wed, Thu, Fri] }
