# Phase-2 LLM confirmation gate. Only takes effect in `live` mode (agent strategy is live/forward
# only; backtest always uses the deterministic IchimokuPullback). Needs ANTHROPIC_API_KEY in .env.
mode: deterministic                       # deterministic | agent
orchestrator_model: anthropic:claude-opus-4-8    # gate decision (candidates are rare, so opus is cheap here)
analyst_model: anthropic:claude-haiku-4-5        # the 3 sub-agents
analysts:
  technical: true                         # Ichimoku H4/H1/M15 context (no external fetch)
  fundamental: true                       # OANDA economic calendar
  sentiment: true                         # CFTC COT (AUD net positioning)
veto_default: false                       # gate approves unless an analyst objects
cftc_code: "232741"                       # Australian dollar
