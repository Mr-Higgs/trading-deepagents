# Versioned strategy config. Bump `version` on any rule change; every trade is tagged with it.
version: "v2.0.0"            # WFX Refined Ichimoku: TK-cross entry + ATR stop + 2.55R
instrument: AUD_USD
name: ichimoku_breakout   # active strategy: "ichimoku_pullback" | "ichimoku_breakout" | "ichimoku_confluence"
style: intraday   # trading style -> triple-screen stack: scalping M15/M5/M1 | intraday H1/M15/M5 | swing H4/H1/M15 | position D/H4/H1
timeframes:    # fallback only: used when `style` is omitted. `style` (above) wins when present.
  trend: H4     # cloud direction = long/short bias
  bias: H1      # pullback context
  entry: M15    # trigger candle + decision clock
ichimoku:                   # WFX-standard periods
  tenkan: 9
  kijun: 26
  senkou_b: 52
  displacement: 26
setup:
  h1_pullback_band: 0.0009   # (pullback strategy only) max distance from Tenkan/Kijun zone to count as a pullback
  m15_trigger: [engulfing, pin_bar, hammer, shooting_star, doji]   # (pullback strategy only) reversal candle(s); any match fires
  require_tk_momentum: true  # (pullback strategy only) Tenkan/Kijun must agree with the trade direction
  require_chikou: false      # WFX has no Chikou filter; the TK-cross is the trigger (breakout strategy)
  # --- price-action confirmation gate (deterministic; strategy/price_action.py) ---
  require_candle_trigger: false   # (breakout only) also require an m15_trigger candlestick; pullback already does
  require_price_action: true     # (pullback + breakout) require the price_action_signals confirmation below
  price_action_signals: [bos, sr_confluence]     # ALL must fire: bos (break of structure) | sr_confluence (entry AT an S/R level, suits pullbacks)
  swing_lookback: 2               # fractal half-window; a swing needs this many bars on each side to confirm
  sr_tolerance_pips: 5.0          # S/R cluster width + confluence proximity, in pips
  stop_rule: atr             # "kijun" | "cloud" | "atr" — WFX uses an ATR volatility stop
  stop_buffer_pips: 8.0      # (used only when stop_rule != "atr")
  rr: 2.3                   # take-profit = entry +/- rr * stop_distance (WFX 2.55R)
  atr_length: 14             # WFX ATR lookback
  atr_mult: 2.75             # WFX stop distance = ATR(14) * 2.75
  exit_on_kijun_cross: false  # WFX early exit: close on a Kijun / Tenkan-Kijun cross against the position
  min_trend_distance_pips: 8.0  # (pullback strategy only) H4 close must clear the cloud edge by this many pips
  breakout_ref: base        # (unused by the WFX TK-cross entry; kept for the older breakout variant)
  # --- ichimoku_confluence (only used when name: ichimoku_confluence) ---
  confluence_min_score: 4.0        # min |weighted H4x3+H1x2+M15x1 price-vs-level vote| to allow a trade
  confluence_signals: [kijun, span_a, span_b, cloud]  # price-vs-level votes to count (of kijun/tenkan/span_a/span_b/cloud)
  entry_trigger: pullback          # which inner strategy triggers: "pullback" | "breakout" (backtest winner: breakout)
  tp_mode: ichimoku_level          # "ichimoku_level" (next Ichimoku level, top-down) | "rr" (inner's R:R TP)
  require_thinning_cloud: false    # reserved: favor breakouts when the M15 cloud is diminishing
  # --- ichimoku_cloud_breakout (only used when name: ichimoku_cloud_breakout) ---
  breakout_lookback: 10            # bars to scan back for a cloud break before the retest
  retest_band_pips: 8.0            # how close price must pull back to the broken cloud edge to count as a retest
  # --- ml_signal (only used when name: ml_signal) — see trading_agent/ml/ + strategy/ml_strategy.py ---
  # To trade the ML model: set name above to `ml_signal`, train via `python -m trading_agent.ml.train`,
  # then point model_path at the saved artifact. Empty model_path => MLStrategy fails closed (no trades).
  model_path: ""                   # e.g. data/models/random_forest.joblib
  prob_threshold: 0.5              # min predicted LONG/SHORT probability to act on
  max_hold_bars: 16                # triple-barrier horizon in entry-TF bars; MUST equal the model's training value
